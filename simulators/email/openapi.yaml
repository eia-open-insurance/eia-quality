openapi: 3.1.0
info:
  title: EIA email relay simulator
  version: 1.0.0
  description: |
    Deterministic notification relay test double (SPEC §7.8, §15.3).
    Accept, bounce, suppress and timeout modes are selected with
    `X-Sim-Scenario` or by recipient local part (`bounce@`, `suppressed@`).
    Test double only.
servers:
  - url: http://127.0.0.1:8180/sim/email/v1
    description: Aggregate simulator, host port 8180
  - url: http://127.0.0.1:8184/sim/email/v1
    description: Standalone email relay simulator
paths:
  /messages:
    post:
      summary: Deliver a notification message
      operationId: postMessage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '201':
          description: Accepted and delivered, bounced or suppressed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '200':
          description: Duplicate notification attempt acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      summary: List messages
      operationId: listMessages
      parameters:
        - name: notificationId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [DELIVERED, BOUNCED, SUPPRESSED]
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /messages/{messageId}:
    get:
      summary: Get a message and its delivery status
      operationId: getMessage
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            example: EML-000001
      responses:
        '200':
          description: Message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/state:
    get:
      summary: Simulator control state
      operationId: getState
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /admin/reset:
    post:
      summary: Reset in-memory state
      operationId: reset
      responses:
        '200':
          description: Reset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /admin/scenarios:
    get:
      summary: Read the default fault scenario
      operationId: getScenario
      responses:
        '200':
          description: Scenario state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Set or clear the default fault scenario
      operationId: setScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: [string, 'null']
      responses:
        '200':
          description: Scenario state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    Scenario:
      name: X-Sim-Scenario
      in: header
      required: false
      schema:
        type: string
        enum: [accept, bounce, suppress, reject, timeout, malformed, unavailable, throttled, duplicate]
  responses:
    Problem:
      description: Problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        category:
          type: string
        retryable:
          type: boolean
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    Envelope:
      type: object
      required: [messageId, tenantId, sourceSystem, targetSystem, schemaVersion, createdAt]
      properties:
        messageId:
          type: string
        idempotencyKey:
          type: string
        tenantId:
          type: string
        sourceSystem:
          type: string
        targetSystem:
          type: string
          example: EMAIL_RELAY
        schemaVersion:
          type: string
        createdAt:
          type: string
          format: date-time
    Recipient:
      type: object
      required: [address]
      properties:
        address:
          type: string
          format: email
        name:
          type: string
    MessageRequest:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [notificationId, recipients, subject, body]
          properties:
            notificationId:
              type: string
            attempt:
              type: integer
              minimum: 1
              maximum: 5
              default: 1
            recipients:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Recipient'
            cc:
              type: array
              items:
                $ref: '#/components/schemas/Recipient'
            subject:
              type: string
              maxLength: 200
            body:
              type: string
              maxLength: 10000
            templateCode:
              type: string
            classification:
              type: string
              enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED, PHI]
    Message:
      type: object
      properties:
        messageId:
          type: string
        providerMessageId:
          type: string
        notificationId:
          type: string
        attempt:
          type: integer
        status:
          type: string
          enum: [DELIVERED, BOUNCED, SUPPRESSED]
        recipients:
          type: array
          items:
            type: object
            additionalProperties: true
        subject:
          type: string
        templateCode:
          type: [string, 'null']
        classification:
          type: [string, 'null']
        acceptedAt:
          type: string
        deliveredAt:
          type: [string, 'null']
        bounce:
          type: [object, 'null']
          additionalProperties: true
        duplicate:
          type: boolean
        _links:
          type: object
          additionalProperties: true
