openapi: 3.1.0
info:
  title: EIA OCR simulator
  version: 1.0.0
  description: |
    Deterministic document extraction test double (SPEC §7.8, §15.3).
    Extraction completes synchronously with synthetic fields. Modes:
    completed (default), low confidence, failed, rejected, timeout.
    Test double only.
servers:
  - url: http://127.0.0.1:8180/sim/ocr/v1
    description: Aggregate simulator, host port 8180
  - url: http://127.0.0.1:8185/sim/ocr/v1
    description: Standalone OCR simulator
paths:
  /documents:
    post:
      summary: Submit a document version for extraction
      description: Idempotent by documentId + versionHash. A new version is a new job.
      operationId: submitDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
      responses:
        '201':
          description: Extraction job completed or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '200':
          description: Duplicate document version acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      summary: List extraction jobs
      operationId: listDocuments
      parameters:
        - name: documentId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [COMPLETED, LOW_CONFIDENCE, FAILED]
      responses:
        '200':
          description: Job page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /documents/{jobId}:
    get:
      summary: Get an extraction result
      operationId: getDocument
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            example: OCR-000001
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/state:
    get:
      summary: Simulator control state
      operationId: getState
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /admin/reset:
    post:
      summary: Reset in-memory state
      operationId: reset
      responses:
        '200':
          description: Reset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /admin/scenarios:
    get:
      summary: Read the default fault scenario
      operationId: getScenario
      responses:
        '200':
          description: Scenario state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Set or clear the default fault scenario
      operationId: setScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: [string, 'null']
      responses:
        '200':
          description: Scenario state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    Scenario:
      name: X-Sim-Scenario
      in: header
      required: false
      schema:
        type: string
        enum: [accept, low_confidence, fail, reject, timeout, malformed, unavailable, throttled, duplicate]
  responses:
    Problem:
      description: Problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        category:
          type: string
        retryable:
          type: boolean
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    Envelope:
      type: object
      required: [messageId, tenantId, sourceSystem, targetSystem, schemaVersion, createdAt]
      properties:
        messageId:
          type: string
        idempotencyKey:
          type: string
        tenantId:
          type: string
        sourceSystem:
          type: string
        targetSystem:
          type: string
          example: OCR
        schemaVersion:
          type: string
        createdAt:
          type: string
          format: date-time
    DocumentRequest:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [documentId, documentType, versionHash]
          properties:
            documentId:
              type: string
            documentType:
              type: string
              enum: [CMS1500, UB04, INVOICE, LOSS_ADVICE, POLICE_REPORT, OTHER]
            versionHash:
              type: string
              pattern: '^[A-Za-z0-9_-]{8,128}$'
            contentType:
              type: string
            contentBase64:
              type: string
              contentEncoding: base64
            pageCount:
              type: integer
              minimum: 1
              maximum: 500
            callbackUrl:
              type: string
              format: uri
    Job:
      type: object
      properties:
        jobId:
          type: string
        documentId:
          type: string
        documentType:
          type: string
        versionHash:
          type: string
        status:
          type: string
          enum: [COMPLETED, LOW_CONFIDENCE, FAILED]
        confidence:
          type: number
        pageCount:
          type: integer
        extractedFields:
          type: object
          additionalProperties: true
        fieldConfidences:
          type: object
          additionalProperties:
            type: number
        completedAt:
          type: string
        durationMs:
          type: integer
        callbackUrl:
          type: [string, 'null']
        error:
          type: [object, 'null']
          additionalProperties: true
        duplicate:
          type: boolean
        _links:
          type: object
          additionalProperties: true
