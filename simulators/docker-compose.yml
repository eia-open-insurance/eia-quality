# Local E2E stack for the external-system simulators.
#
# Every container listens on 8080; host ports are only for local tools.
# The aggregate service is named "simulators" so the SPEC §15.3 URL
#   http://simulators:8080/sim/fsri/v1
# resolves inside this Compose network.
#
#   docker compose -f simulators/docker-compose.yml up --build
#
name: eia-simulators

services:
  simulators:
    build:
      context: ..
      dockerfile: simulators/all/Dockerfile
    ports:
      - "8180:8080"
    environment:
      SIM_CLOCK: ${SIM_CLOCK:-2026-10-19T12:00:00.000Z}
    restart: "no"

  fsri:
    build:
      context: ..
      dockerfile: simulators/fsri/Dockerfile
    ports:
      - "8181:8080"
    environment:
      SIM_CLOCK: ${SIM_CLOCK:-2026-10-19T12:00:00.000Z}
    restart: "no"

  s4:
    build:
      context: ..
      dockerfile: simulators/s4/Dockerfile
    ports:
      - "8182:8080"
    environment:
      SIM_CLOCK: ${SIM_CLOCK:-2026-10-19T12:00:00.000Z}
    restart: "no"

  bank:
    build:
      context: ..
      dockerfile: simulators/bank/Dockerfile
    ports:
      - "8183:8080"
    environment:
      SIM_CLOCK: ${SIM_CLOCK:-2026-10-19T12:00:00.000Z}
    restart: "no"

  email:
    build:
      context: ..
      dockerfile: simulators/email/Dockerfile
    ports:
      - "8184:8080"
    environment:
      SIM_CLOCK: ${SIM_CLOCK:-2026-10-19T12:00:00.000Z}
    restart: "no"

  ocr:
    build:
      context: ..
      dockerfile: simulators/ocr/Dockerfile
    ports:
      - "8185:8080"
    environment:
      SIM_CLOCK: ${SIM_CLOCK:-2026-10-19T12:00:00.000Z}
    restart: "no"

  sanctions:
    build:
      context: ..
      dockerfile: simulators/sanctions/Dockerfile
    ports:
      - "8186:8080"
    environment:
      SIM_CLOCK: ${SIM_CLOCK:-2026-10-19T12:00:00.000Z}
    restart: "no"
